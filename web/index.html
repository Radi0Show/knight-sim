<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Black Knife Simulator</title>
<style>
  /* THE GAME FILLS THE WINDOW, and nothing else is on screen.
     The page used to be a canvas with a debug readout under it (frame
     counter, HP, sprite count, key legend) and the canvas sized to leave
     room for that line. It read as a harness with a game inside it; the
     real thing is 640x480 letterboxed into whatever it is given. */
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    color: #ccc;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    /* MOBILE: the page is a game, not a document. No scroll, no pinch zoom,
       no rubber-banding, no long-press callout — every one of those gestures
       is a dodge input the browser would otherwise steal. */
    touch-action: none;
    overscroll-behavior: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  /* The letterbox: centre the canvas in the viewport and let the aspect
     ratio decide which pair of bars appears. `min()` on both axes is what
     keeps the WHOLE frame on screen — sizing on width alone once made the
     canvas taller than the window and cropped the top ~65 rows, which is
     exactly where the Stars cone opens and where the Knight stands.

     THIS IS THE PRE-SCRIPT FALLBACK ONLY. `fitCanvas()` in main.js
     overrides both axes with an INTEGER-multiple size, because
     `image-rendering: pixelated` at a fractional scale is what produced
     the reported "weird" menu text: nearest-neighbour with a 4.725x
     factor gives some source pixels 4 device pixels and others 5, so a
     1px font stem is thick on one letter and thin on the next. There is
     no filtering that fixes that — only landing on a whole number. */
  #game {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(100vw, calc(100vh * 4 / 3));
    height: min(100vh, calc(100vw * 3 / 4));
    background: #000;
    /* Nearest-neighbour, like every other surface in this project. */
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    image-rendering: pixelated;
  }
  /* ATTRIBUTION. Small, dim, and at the very bottom of the window rather than
     inside the 640x480 frame -- the frame is the game's own art and nothing
     of ours belongs on it. `pointer-events: none` so it can never eat a click
     meant for the canvas, and it steps up out of the way when the debug HUD
     is showing, since both live on the bottom edge. */
  #credit {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    margin: 0;
    padding: 4px 8px;
    text-align: center;
    font-size: 11px;
    color: #555;
    pointer-events: none;
    user-select: none;
  }
  /* ---- TOUCH CONTROLS ------------------------------------------------
     Hidden on fine-pointer machines; shown wherever the primary pointer is
     coarse. The container ignores pointers so the play area stays clean —
     only the pad and buttons themselves are targets. Positions respect the
     notch/home-bar insets. */
  #touch { display: none; }
  @media (pointer: coarse) {
    #touch {
      display: block;
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }
  }
  #touch .pad, #touch .btn {
    position: absolute;
    pointer-events: auto;
    touch-action: none;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.25);
    background: rgba(255, 255, 255, 0.06);
  }
  #dpad {
    left: max(18px, env(safe-area-inset-left));
    bottom: max(18px, env(safe-area-inset-bottom));
    width: 148px;
    height: 148px;
  }
  /* The pad's cross, drawn with gradients so there is no asset to load. */
  #dpad::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(rgba(255,255,255,0.14), rgba(255,255,255,0.14)) 50% 0 / 34% 100% no-repeat,
      linear-gradient(rgba(255,255,255,0.14), rgba(255,255,255,0.14)) 0 50% / 100% 34% no-repeat;
    border-radius: inherit;
  }
  #touch .btn {
    width: 64px;
    height: 64px;
    color: rgba(255, 255, 255, 0.55);
    font: bold 20px/60px ui-monospace, Menlo, monospace;
    text-align: center;
  }
  #touch .btn.down { background: rgba(255, 255, 255, 0.22); }
  #btnZ {
    right: max(20px, env(safe-area-inset-right));
    bottom: calc(max(18px, env(safe-area-inset-bottom)) + 74px);
  }
  #btnX {
    right: calc(max(20px, env(safe-area-inset-right)) + 74px);
    bottom: max(18px, env(safe-area-inset-bottom));
  }
  #touch #btnR {
    top: max(14px, env(safe-area-inset-top));
    right: max(14px, env(safe-area-inset-right));
    width: 44px;
    height: 44px;
    font-size: 15px;
    line-height: 40px;
  }
  /* SIDEWAYS. In portrait the letterbox is above and below the frame, so the
     controls live in the black band underneath. In landscape the frame fills
     the HEIGHT and the black bands move to the SIDES — the bottom corners
     would sit on the game's own menu band (the 640x480 frame's bottom strip
     is the button row and HP readout). So the pad and buttons move into the
     side bars, vertically a little below centre, which is where thumbs
     naturally rest on a held-sideways phone. R keeps its top-right corner.
     Same sizes, same tolerances — only the anchors change. */
  @media (pointer: coarse) and (orientation: landscape) {
    /* The frame fills the height, so the window's bottom edge is the FRAME's
       bottom edge — the credit was sitting on the game's own footer text.
       Top-left is the one corner nothing claims (R owns top-right). */
    #credit {
      bottom: auto;
      top: max(14px, env(safe-area-inset-top));
      left: max(14px, env(safe-area-inset-left));
      right: auto;
      text-align: left;
    }
    #dpad {
      left: max(12px, env(safe-area-inset-left));
      bottom: auto;
      top: 55%;
      transform: translateY(-50%);
    }
    #btnZ {
      right: max(16px, env(safe-area-inset-right));
      bottom: auto;
      top: calc(55% - 58px);
      transform: translateY(-50%);
    }
    #btnX {
      right: calc(max(16px, env(safe-area-inset-right)) + 40px);
      bottom: auto;
      top: calc(55% + 30px);
      transform: translateY(-50%);
    }
  }
</style>
</head>
<body>
  <canvas id="game" width="640" height="480"></canvas>
  <p id="credit">Game is by Toby Fox and the Deltarune Team</p>
  <div id="touch">
    <div id="dpad" class="pad"></div>
    <div id="btnZ" class="btn">Z</div>
    <div id="btnX" class="btn">X</div>
    <div id="btnR" class="btn">R</div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
